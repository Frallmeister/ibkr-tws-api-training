[project]
name = "ibkr-tws-api-training"
version = "0.1.0"
description = "Learning material for the native Interactive Brokers TWS API in Python"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
